on: [push, pull_request]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Instalar dependências leves de teste

        run: pip install ruff pytest pydantic

      - name: Verificar estilo com Ruff

        run: ruff check .

      - name: Executar testes com Pytest

        run: pytest -v
